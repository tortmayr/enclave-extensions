schemaVersion: "1"
kind: mixin
name: shell-ext
displayName: Shell Environment
description: Personal zsh environment (portable dotfiles, powerlevel10k, plugins) for interactive sessions
defaultEnabled: false
needsRoot: false
failOnInstallError: true
priority: 90
aptPackages:
  # zsh itself, plus every command the dotfiles call. git, tmux, direnv and
  # ncurses-term are already in the enclave base image.
  - zsh
  - nano
  - eza
  - bat
  - fd-find
  - fzf
  - less
  - lazygit
